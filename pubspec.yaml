name: kchan
description: "Kchan - Bangumi metadata + aggregated anime sources, local-first player"
publish_to: 'none'
version: 2.1.10+28

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 网络与解析
  http: ^1.2.2
  # 本地存储
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  # 播放器：media-kit(libmpv) 为主（v1.9.0 起），video_player+fvp 为运行时兜底
  #
  # 【Android 原生库 · 必装，否则安卓上点播放没有任何反应】
  #
  # `media_kit` 与 `media_kit_video` **只是 Dart 层**，libmpv 的原生 .so
  # 由各平台的 `media_kit_libs_*_video` 包提供：
  #     media_kit_libs_android_video  → Android 的 libmpv.so（本行）
  #     （Windows 用系统内自带的 libmpv-2.dll，见 build_win_kernel 的打包步骤）
  # 之前只声明了 Dart 层，`package_config.json` 里查不到任何 libs_android 包，
  # 所以打出来的 APK 在 selectVideoTrack 之前就静默失败。
  media_kit_libs_android_video: ^1.3.8
  media_kit: ^1.2.6
  media_kit_video: ^1.3.1
  video_player: ^2.9.2
  fvp: ^0.39.0
  # 图片缓存
  cached_network_image: ^3.4.1
  # 规则引擎：XPath（对齐 Kazumi 的 JSON+XPath 规则格式）
  html: ^0.15.5
  # WebView：解析 jx 云播放器的真实播放地址（HTML 里是空的，必须跑 JS）
  webview_flutter: ^4.14.1
  # Android 专属 WebView 配置（混合内容模式 / 免手势起播）。
  # 直接 import 了它，所以显式声明，别依赖 webview_flutter 的传递依赖。
  webview_flutter_android: ^4.10.0
  # Windows 本地解析：无头 Edge + CDP（纯 Dart，见 lib/api/edge_cdp_resolver.dart）
  web_socket_channel: ^3.0.3
  # 弹幕渲染引擎（CustomPainter 直绘，非每弹幕一 Widget）
  # 【锁死版本】0.4.0 有破坏性变更（PR #20：接口改动、需显式指定 size），
  # 所以不用 ^0.3.3，避免自动升级后编译失败。
  canvas_danmaku: 0.3.3
  # 弹弹play 弹幕签名（SHA-256）
  crypto: ^3.0.0
  # 系统代理：dart:ffi 的内存分配辅助（calloc）
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Kazumi 规则库（运行期加载，AOT 树摇不会消除 JSON 资产）
  assets:
    - assets/rules/kazumi_rules.json

  # 内置中文衬线 + 无衬线（Noto Serif SC / Noto Sans SC 静态子集）
  # 让标题呈现纸墨感、正文清晰，全平台字体一致，不依赖系统字体
  fonts:
    - family: KSerif
      fonts:
        - asset: assets/fonts/serif-400.ttf
          weight: 400
        - asset: assets/fonts/serif-500.ttf
          weight: 500
        - asset: assets/fonts/serif-600.ttf
          weight: 600
    - family: KSans
      fonts:
        - asset: assets/fonts/sans-400.ttf
          weight: 400
        - asset: assets/fonts/sans-500.ttf
          weight: 500
        - asset: assets/fonts/sans-700.ttf
          weight: 700

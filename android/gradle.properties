# ── Gradle JVM ──────────────────────────────────────────────────────────
# `-Dfile.encoding=UTF-8` 不可省。
#
# 本机构建路径含中文（C:\Users\杨坤\...），JDK 17 在中文 Windows 上默认
# file.encoding=GBK。Gradle 把 NDK/ninja 的工作目录按 GBK 字节交给 ninja，
# 而 ninja 按 UTF-8 解，路径变成 `C:\Users\����\...`，于是：
#     ninja: fatal: chdir to '...\.cxx\RelWithDebInfo\...' - No such file or directory
# 而那个目录其实是存在的。
#
# 同理加 sun.jnu.encoding=UTF-8，否则 JVM 读写中文文件名仍会错。
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ── 关闭 Kotlin 增量编译 ────────────────────────────────────────────────
#
# 报错：`IllegalArgumentException: this and base files have different roots:
#        C:\Users\杨坤\AppData\Local\Pub\Cache\... and D:\dev\scaffold\android`
#
# 原因：pub 缓存在 C: 盘，工程在 D: 盘。Kotlin 增量编译器要给每个源文件算
# 相对于工程根的路径，跨盘时 Windows 无法做相对路径（没有公共祖先），于是
# `toRelativeString()` 直接抛异常，整个 compileReleaseKotlin 失败。
#
# 关掉增量编译即可（代价只是全量重编，本工程规模下多花几十秒）。
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

# ── 构建期代理（只影响构建机，不影响产出的 APK）────────────────────────
#
# 为什么需要：`media_kit_libs_android_video` 的 gradle 任务要从
# github.com 下载 libmpv 的预编译 .so（v1.1.7 的 4 个 jar，共 22MB）。
# 本机直连 github.com 会被中断（实测 19~21s 后 RemoteDisconnected /
# 连接超时），assembleRelease 因此卡在 CPU 156s 不再前进。
#
# ⚠ 这几行只作用于**构建过程**。APK 里不含任何代理设置 ——
# 装到手机后走系统网络，「反代加速」仍然由 App 内的
# 「设置 → 自建反代」决定（填 https://kchan.top 即可，与 Windows 同一套）。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.0.0.1
